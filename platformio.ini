; =============================================================================
; ESP32-C3 ShutterLink — PlatformIO Configuration
; =============================================================================
; Open-source replica for camera control.
; Bridge between Betaflight FC (MSP/UART) and DJI Action 2 (BLE).
; =============================================================================

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; ---------- Partitions: app needs > 1.2 MB (BLE + WiFi + Web UI) ----------
board_build.partitions = min_spiffs.csv

; ---------- NimBLE BLE library (mandatory — replaces Bluedroid) -------------
lib_deps =
    h2zero/NimBLE-Arduino@1.4.1

; ---------- Build flags -----------------------------------------------------
build_flags =
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL=1
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER=1
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_MAX_BONDS=3
    -D CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=256
    -D CORE_DEBUG_LEVEL=3

; ---------- Serial Monitor --------------------------------------------------
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ---------- Upload ----------------------------------------------------------
upload_speed = 921600
